import groovy.json.JsonSlurper

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

// react-native-config: load .env file for build-time config variables
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// ── Version stamping (reviews M-MOBILE-15 / M-MOBILE-25) ────────────────────
// THE SINGLE SOURCE is the root `package.json` "version". Bumping that one
// line moves Android versionName AND the Play Store versionCode together, so
// the rolling-`latest` sideload artifact can no longer re-publish under an
// identical version stamp (the old hardcoded `versionCode 1` made every
// release byte-indistinguishable for upgraders). SemVer maps into the int as
// major*1_000_000 + minor*1_000 + patch — monotonic for normal bumps. The iOS
// side stays literal in `project.pbxproj` (Xcode cannot read package.json),
// so `src/__tests__/versionSync.test.ts` fails loudly when the stores drift.
// rootProject.projectDir is `android/`; its parent is the repo root where
// package.json lives. (A `projectDir/../` spelling resolves to `android/` and
// fails evaluation — pinned honestly by versionSync.test.ts.)
def phlixPackageJson = new JsonSlurper().parse(new File(rootProject.projectDir.parentFile, 'package.json'))
def phlixVersionCore = phlixPackageJson.version.toString().tokenize('-')[0].tokenize('.')
def phlixVersionCode = (phlixVersionCore[0].toInteger() * 1000000 +
                        phlixVersionCore[1].toInteger() * 1000 +
                        phlixVersionCore[2].toInteger())

react {
    // Autolinking: link all React Native native modules into the app.
    autolinkLibrariesWithApp()
}

android {
    namespace 'com.phlixmobile'
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.phlixmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode phlixVersionCode
        versionName phlixPackageJson.version.toString()
    }

    signingConfigs {
        debug {
            // Debug signing config for development
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
        }
        release {
            // Sign release builds with the debug key so `assembleRelease` emits an
            // INSTALLABLE app-release.apk (an unsigned APK can't be sideloaded). This
            // is the rolling-`latest` sideload artifact; a Play Store build should
            // swap in a real release keystore (via CI secrets on a version tag).
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // ONE targeted suppression, not a gag order (review M-MOBILE-22).
        // 'ReleaseLifecycle' fires because the release variant deliberately
        // signs with the DEBUG key for the rolling-`latest` sideload artifact
        // (see buildTypes.release above) — that is by design, so that single
        // check is disabled by id.
        disable 'ReleaseLifecycle'
        // Same debug-key hedge: keep lintVitalRelease off the assembleRelease
        // path or the sideload build would die on the disabled-by-id finding.
        checkReleaseBuilds false
        // The old blanket `abortOnError false` is GONE: it silenced every
        // other lint finding too. CI runs assembleDebug/assembleRelease only
        // (no lint task), so removal changes no CI behavior; anyone running
        // `./gradlew lint` now gets the fail-loud truth.
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // React Native (versions injected by the React Native Gradle Plugin)
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // ExoPlayer2
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'

    // Credential Manager — WebAuthn / passkeys (E10e). The play-services-auth
    // artifact provides the FIDO2 / passkey provider behind Credential Manager.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
}
