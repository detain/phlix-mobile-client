# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m

# AndroidX
android.useAndroidX=true
# Jetifier is OFF: RN 0.85 (and all our deps) are AndroidX-native. Leaving it on
# ran JetifyTransform over the large react-android AAR and OOMed the build.
android.enableJetifier=false

# R8 full-mode semantics. Truth: app/build.gradle currently ships
# minifyEnabled false (the release artifact is a debug-signed sideload build),
# so R8 never runs today and this flag is DORMANT — it only takes effect if
# code shrinking is switched on, at which point full mode is the intent.
# [review M-MOBILE-23]
android.enableR8.fullMode=true

# Use non-transitive R classes
android.nonTransitiveRClass=true

# Enable parallel builds
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true

# Use the New Architecture (Fabric/TurboModules with the legacy interop layer)
newArchEnabled=true

# Use Hermes JS engine
hermesEnabled=true
