name: Build iOS

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Supersede in-flight runs on the same ref (review M-MOBILE-22); macOS runners
# are the scarce resource here, and master/main are exempt from cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

jobs:
  build-ios-debug:
    name: Build iOS (Debug)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode toolchain
        # MOB-21: pin the Xcode the runner uses (macos-15 images carry several)
        # so a runner-image default bump cannot change the iOS toolchain
        # silently. RN 0.88 needs Xcode >= 16.1 (README).
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Setup Ruby (pinned CocoaPods via Gemfile.lock)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        # The tracked package-lock.json is the source of truth: `npm install`
        # re-resolves ranges and silently rewrites the lock mid-CI (this
        # repo's own CHANGELOG records a 152-marker devOptional->dev churn
        # from exactly that command). `npm ci` installs the lock verbatim and
        # fails loud on drift. --allow-git=all admits the @phlix/* github:
        # tarball pins (npm 11 install hardening; same form as phlix-tizen).
        run: npm ci --allow-git=all

      - name: Clean iOS build directories
        # `ios/Podfile.lock` is committed (review M-MOBILE-09) and MUST survive
        # the purge — deleting it is what let every caret pod float to its
        # newest release on each CI run. Build dirs only from now on.
        run: rm -rf ios/build ios/Pods

      # M36 (deferred lane): the `ios/Pods` tree stays purged (M-MOBILE-09 law)
      # but the CocoaPods DOWNLOAD cache is pure input — priming it makes the
      # rebuild download-free without ever skipping resolution.
      - name: Cache CocoaPods downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install iOS dependencies
        run: bundle exec pod install --project-directory=ios

      - name: Build iOS (Debug)
        run: |
          xcodebuild -workspace ios/PhlixMobile.xcworkspace \
            -scheme PhlixMobile \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            build CODE_SIGNING_ALLOWED=NO

      - name: Create JS bundle
        # Standalone inspection artifact (bundle-size / JS review), uploaded as
        # the jsbundle. NOT an over-the-air payload: the installed app embeds
        # its own copy through xcodebuild's "Bundle React Native code and
        # images" phase, and nothing at runtime loads the bundle from disk.
        # --minify false keeps the uploaded bundle readable. [review M-MOBILE-23]
        # The `.js` suffix is Metro's own naming law (M-MOBILE-22): metro v0.84
        # appends `.js` to a bare `--out ios/main.jsbundle`, so the upload paths
        # used to look for a file that was never written and silently uploaded
        # NOTHING while staying green. Ask for the real name instead.
        run: npx metro build index.js --platform ios --out ios/main.jsbundle.js --minify false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-debug
          # Debug builds emit plain DWARF (DEBUG_INFORMATION_FORMAT=dwarf), so
          # the old `PhlixMobile.app.dSYM.zip` path here was fiction — the
          # artifact is the bundle alone.
          path: ios/main.jsbundle.js
          retention-days: 7
          # Review M-MOBILE-22: empty uploads used to warn-and-skip; a green
          # iOS job that carries no bundle is now a red job.
          if-no-files-found: error

  build-ios-release:
    name: Build iOS (Release)
    runs-on: macos-15
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode toolchain
        # MOB-21: pin the Xcode the runner uses (macos-15 images carry several)
        # so a runner-image default bump cannot change the iOS toolchain
        # silently. RN 0.88 needs Xcode >= 16.1 (README).
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Setup Ruby (pinned CocoaPods via Gemfile.lock)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        # Lock-honoring install; rationale at the Build (Debug) job's leg.
        run: npm ci --allow-git=all

      - name: Clean iOS build directories
        # Lock survives — see the Debug job's note (M-MOBILE-09).
        run: rm -rf ios/build ios/Pods

      # M36: shared key with the Debug job (same Podfile.lock input).
      - name: Cache CocoaPods downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install iOS dependencies
        run: bundle exec pod install --project-directory=ios

      - name: Create JS bundle
        # Same law as the Debug job (M-MOBILE-22/23): Metro's real output name
        # ends in `.js`; ask for it explicitly so the upload finds it.
        run: npx metro build index.js --platform ios --out ios/main.jsbundle.js --minify false

      - name: Build iOS (Release)
        run: |
          xcodebuild -workspace ios/PhlixMobile.xcworkspace \
            -scheme PhlixMobile \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            build CODE_SIGNING_ALLOWED=NO

      - name: Build iOS (Release, device slice, unsigned)
        # MOB-47: the simulator slice above never compiles arm64-device code;
        # this leg does, without needing signing identities.
        run: |
          xcodebuild -workspace ios/PhlixMobile.xcworkspace \
            -scheme PhlixMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build-device \
            build CODE_SIGNING_ALLOWED=NO

      - name: Upload Release build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-release
          # Release configuration builds with dwarf-with-dsym, so a real
          # `PhlixMobile.app.dSYM` directory exists next to the .app — the old
          # `PhlixMobile.app.dSYM.zip` path was archive-only fiction and this
          # step uploaded nothing while green (M-MOBILE-22). Glob covers the
          # dSYM wherever Products nests it.
          path: |
            ios/main.jsbundle.js
            ios/build/Build/Products/**/PhlixMobile.app.dSYM/**
          retention-days: 14
          if-no-files-found: error
