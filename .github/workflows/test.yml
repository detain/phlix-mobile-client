name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        # --coverage is REQUIRED for the uploads below to have anything to send.
        # jest.config.js sets collectCoverageFrom but NOT collectCoverage, so
        # without this flag ./coverage/lcov.info is never written and both the
        # Codecov and Codacy steps silently upload nothing while reporting green.
        # (lcov is in jest's default coverageReporters, so no config change is needed.)
        run: npm test -- --passWithNoTests --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        continue-on-error: true
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage.xml
