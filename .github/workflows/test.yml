name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Supersede in-flight runs on the same ref (review M-MOBILE-22): a push that
# lands while its predecessor is still running makes the older run dead weight.
# master/main are NOT cancelled — they own the rolling `latest` publish and
# killing a run mid-release-reset can strand the tag without an asset.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        # The tracked package-lock.json is the source of truth: `npm install`
        # re-resolves ranges and silently rewrites the lock mid-CI (this
        # repo's own CHANGELOG records a 152-marker devOptional->dev churn
        # from exactly that command). `npm ci` installs the lock verbatim and
        # fails loud on drift. --allow-git=all admits the @phlix/* github:
        # tarball pins (npm 11 install hardening; same form as phlix-tizen).
        run: npm ci --allow-git=all

      - name: Type check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      # M38 (deferred lane): the copyright header was a one-off migration with
      # no teeth — new files could drift in unheadered. --check makes it a gate.
      - name: Copyright headers
        run: npm run copyright -- --check

      # Review Major 1 (2026-11-03): Podfile.lock drift. The range's two new
      # native pods were absent from the committed lock and the bare
      # `pod install` in build-ios.yml re-resolved them silently every run.
      # This leg is host-agnostic (node-only, reads `react-native config` —
      # the same source use_native_modules! consumes), so the Linux test job
      # catches iOS-lock drift that the macOS build leg structurally cannot.
      - name: Podfile.lock sync (native pod auto-link)
        run: npm run check:podfile-lock

      - name: Security audit (reviewed-allowlist gate)
        # MW-100 (review w07L4 DD #3): replaces the bare `npm audit
        # --audit-level=high` posture — a severity filter hides every
        # moderate-or-below advisory, greens on a broken audit, and keeps the
        # accepted-risk set invisible. The gate enforces a SUBSET law: every
        # reported advisory id (ANY severity) must appear in
        # scripts/audit-gate.mjs ALLOWED_ADVISORIES with a measured
        # justification; anything else reddens (exit 1), and a broken audit
        # fails structurally (exit 2). The step's exit code IS the gate — no
        # shell-level suppression, no per-step opt-out (both are pinned away
        # by src/__tests__/workflowInstalls.gate.test.ts).
        run: npm run audit:gate

      - name: Run tests
        # --coverage is REQUIRED for the uploads below to have anything to send.
        # jest.config.js sets collectCoverageFrom but NOT collectCoverage, so
        # without this flag ./coverage/lcov.info is never written and both the
        # Codecov and Codacy steps silently upload nothing while reporting green.
        # (lcov is in jest's default coverageReporters, so no config change is needed.)
        # NO --passWithNoTests (estate CI-gate audit 2026-10-02): the suite is
        # real, so a jest.config/testMatch regression (or a typo'd pattern) that
        # matches ZERO tests must exit 1 — never green this step vacuously.
        # MW-016 (review mobile__devops): SERIAL by law — the package.json test
        # script carries `jest --runInBand` (estate convention, CHANGELOG-gated
        # local practice), so this invocation and README's "the Jest suite
        # (serial)" claim describe the SAME execution. Before this wave the CI
        # line ran default parallel workers while the README asserted serial.
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        continue-on-error: true
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage/lcov.info
