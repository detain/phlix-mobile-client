name: Build Android

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Supersede in-flight runs on the same ref (review M-MOBILE-22); master/main are
# exempt so a queued master push never cancels a release-latest mid-publish.
# The old delete-then-publish shape made such a cancel fatal (`latest` deleted
# with no replacement until the next push); release-latest is now
# publish-first (MOB-22 — see its step comment), so a mid-flight death leaves
# the previous `latest` standing. The exemption stays as belt-and-braces: it
# keeps the asset/tag/notes trio from being left half-advanced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

jobs:
  build-android:
    name: Build Android (Debug)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        # The tracked package-lock.json is the source of truth: `npm install`
        # re-resolves ranges and silently rewrites the lock mid-CI (this
        # repo's own CHANGELOG records a 152-marker devOptional->dev churn
        # from exactly that command). `npm ci` installs the lock verbatim and
        # fails loud on drift. --allow-git=all admits the @phlix/* github:
        # tarball pins (npm 11 install hardening; same form as phlix-tizen).
        run: npm ci --allow-git=all

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platform-tools'

      # M36 (deferred lane): every push recompiled Gradle from scratch — this
      # workflow's dominant wall-clock cost. Key on everything that can move
      # the build graph (gradle scripts, wrapper, properties, the npm lock that
      # feeds codegen/assets); restore-keys reuse the newest partial prefix so
      # a dependency bump degrades gracefully instead of cold-starting.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Android (Debug)
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          # A green build that uploads nothing was silently invisible here
          # (review M-MOBILE-22): fail the step when the expected APK is absent.
          if-no-files-found: error

  build-android-release:
    name: Build Android (Release)
    runs-on: ubuntu-26.04
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        # Lock-honoring install; rationale at the Build (Debug) leg.
        run: npm ci --allow-git=all

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platform-tools'

      # M36: shared with the debug job (identical key inputs) — whichever
      # master push runs first seeds the cache for the other.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Android (Release)
        run: cd android && ./gradlew assembleRelease

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          # See debug upload: release-latest consumes this artifact, so a quiet
          # empty upload would cascade into a broken `latest` release.
          if-no-files-found: error

  release-latest:
    name: Update "latest" prerelease
    needs: build-android-release
    # On every master/main push, overwrite a rolling "latest" GitHub Release
    # carrying the RAW release APK as a directly-downloadable asset (GitHub
    # Actions artifacts are always served zipped — a Release is the only way to
    # offer a bare, installable .apk). PRs don't reach here (the release build
    # itself is gated to master/main).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Release APK
        uses: actions/download-artifact@v8
        with:
          name: android-release-apk
          path: artifacts

      # MOB-22: publish-first. The old shape ran `gh release delete latest
      # --cleanup-tag` and only THEN published — a runner death, cancel or
      # publish failure between the two left the repo with NO `latest`
      # release and NO tag until the next master push (the delete-then-die
      # class). CURED here: nothing is ever deleted up front. If `latest`
      # exists, the new APK is uploaded over the old asset (--clobber), the
      # tag ref is force-moved to this commit, then the release metadata is
      # edited; `gh release create` is only the fallback for a repo with no
      # `latest` yet (first run, or one deleted by hand). A death at any point
      # leaves the previous release standing. Residual, narrower window:
      # --clobber swaps the asset by name, so the APK can be absent for the
      # seconds of the upload itself — the release and tag never are.
      - name: Publish "latest" prerelease (publish-first)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/latest-notes.md"
          {
            printf 'Rolling build of the latest `master` commit (%s).\n' "$GITHUB_SHA"
            cat <<'NOTES'
          - **`app-release.apk`** — Android release build, **debug-signed**
            (CI has no release keystore), download + install directly (no
            zip); fine for sideload and testing, not for a store. Because
            each CI runner auto-generates its own debug key, consecutive
            builds can carry different signing identities — if Android
            rejects an update with a signature mismatch
            (INSTALL_FAILED_UPDATE_INCOMPATIBLE), uninstall the old build
            first. iOS isn't published here: App Store / device installs
            need Apple code signing, which CI builds without
            (`CODE_SIGNING_ALLOWED=NO`).
          NOTES
          } > "$notes"
          # Idempotency guard: the existence probe must not trip `set -e`
          # (a missing release is the fallback path, not a failure).
          existing="$(gh release view latest --json tagName --jq .tagName 2>/dev/null || true)"
          if [ "$existing" = "latest" ]; then
            gh release upload latest artifacts/app-release.apk --clobber
            # target_commitish is ignored by the API once the tag exists, so
            # `edit --target` alone would leave the tag on the old commit:
            # move the ref itself first, then record the target on the release.
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit latest --target "$GITHUB_SHA" \
              --title "Latest (master)" --notes-file "$notes" \
              --prerelease --latest=false
          else
            gh release create latest artifacts/app-release.apk \
              --target "$GITHUB_SHA" --title "Latest (master)" \
              --notes-file "$notes" --prerelease --latest=false
          fi
